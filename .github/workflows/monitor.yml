name: iPhone Duo pickup monitor

on:
  # 已停用（2026-10-31 已买到）：去掉了定时启动和自动接力。
  # 要重新开始监控，恢复下面的 schedule 和最后的 "Start next run" 步骤，再手动 Run workflow。
  # schedule:
  #   - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "只发一条测试推送并查询一次库存"
        type: boolean
        default: false
      chained:
        description: "内部使用：由上一轮接力启动"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not configured or already monitoring
        id: guard
        env:
          ZIP: ${{ secrets.ZIP }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          if [ -z "$ZIP" ] || [ -z "$BARK_KEY" ]; then
            echo "::warning::还没设置 Secrets ZIP 和 BARK_KEY，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.chained }}" = "true" ] || [ "${{ inputs.test_notify }}" = "true" ]; then exit 0; fi
          others=0
          for status in in_progress queued; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/monitor.yml/runs?status=$status&per_page=20" \
                  --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
            others=$((others + n))
          done
          echo "other active runs: $others"
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Monitor
        id: monitor
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: python3 monitor.py
        env:
          ZIP: ${{ secrets.ZIP }}
          PARTS: ${{ vars.PARTS }}
          MAX_MILES: ${{ vars.MAX_MILES || '35' }}
          STATES: ${{ vars.STATES || 'NY' }}
          EXTRA_LOCATIONS: ${{ vars.EXTRA_LOCATIONS || '10001' }}
          # 纽约时间 8–11 点早高峰每 60 秒一次请求，其余时间每 75 秒一次，全天不暂停。
          # 早高峰试过 45 秒，约 40 分钟就被限流 30 分钟，所以早高峰不再加速
          INTERVAL: ${{ vars.INTERVAL || '75' }}
          INTERVAL_PLAN: ${{ vars.INTERVAL_PLAN || '8-11:60' }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          BARK_LEVEL: ${{ vars.BARK_LEVEL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
